<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="banner-title">
  <title id="banner-title">José Mário — Full Stack • React • Angular • .NET</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b10"/>
      <stop offset="0.6" stop-color="#0a1017"/>
      <stop offset="1" stop-color="#05070a"/>
    </linearGradient>
    <radialGradient id="moonGlow">
      <stop offset="0" stop-color="#cfe8dd" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#8fd3b6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8fd3b6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonBody" cx="0.4" cy="0.35">
      <stop offset="0" stop-color="#f3f7f2"/>
      <stop offset="1" stop-color="#c6d4cb"/>
    </radialGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd8c2" stop-opacity="0"/>
      <stop offset="1" stop-color="#9fd8c2" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="textGlow" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#sky)"/>

  <!-- estrelas -->
  <g fill="#dfeaf0">
    <circle cx="60" cy="40" r="1.5" opacity="0.7"/>
    <circle cx="140" cy="90" r="1" opacity="0.5"/>
    <circle cx="220" cy="30" r="1.4" opacity="0.8"/>
    <circle cx="310" cy="120" r="1" opacity="0.4"/>
    <circle cx="390" cy="50" r="1.3" opacity="0.6"/>
    <circle cx="470" cy="100" r="1" opacity="0.5"/>
    <circle cx="560" cy="45" r="1.5" opacity="0.75"/>
    <circle cx="640" cy="130" r="1" opacity="0.4"/>
    <circle cx="700" cy="60" r="1.2" opacity="0.6"/>
    <circle cx="760" cy="240" r="1" opacity="0.35"/>
    <circle cx="980" cy="50" r="1.4" opacity="0.7"/>
    <circle cx="1060" cy="110" r="1" opacity="0.5"/>
    <circle cx="1130" cy="40" r="1.5" opacity="0.8"/>
    <circle cx="1170" cy="150" r="1" opacity="0.4"/>
    <circle cx="90" cy="180" r="1" opacity="0.35"/>
    <circle cx="180" cy="250" r="1" opacity="0.3"/>
    <circle cx="350" cy="200" r="1.2" opacity="0.4"/>
    <circle cx="520" cy="290" r="1" opacity="0.3"/>
    <circle cx="700" cy="320" r="1" opacity="0.3"/>
    <circle cx="1000" cy="300" r="1.2" opacity="0.45"/>
    <circle cx="1100" cy="240" r="1" opacity="0.35"/>
    <circle cx="40" cy="320" r="1" opacity="0.3"/>
    <circle cx="250" cy="330" r="1" opacity="0.3"/>
    <circle cx="620" cy="200" r="1" opacity="0.3"/>
    <circle cx="840" cy="300" r="1" opacity="0.3"/>
    <circle cx="1150" cy="330" r="1" opacity="0.3"/>
  </g>

  <!-- lua -->
  <circle cx="880" cy="120" r="150" fill="url(#moonGlow)"/>
  <circle cx="880" cy="120" r="62" fill="url(#moonBody)"/>
  <circle cx="860" cy="100" r="10" fill="#b9c8bf" opacity="0.5"/>
  <circle cx="900" cy="137" r="7" fill="#b9c8bf" opacity="0.45"/>
  <circle cx="895" cy="95" r="5" fill="#b9c8bf" opacity="0.4"/>

  <!-- nuvens -->
  <ellipse cx="300" cy="80" rx="260" ry="28" fill="#0b121a" opacity="0.85"/>
  <ellipse cx="520" cy="40" rx="220" ry="22" fill="#0b121a" opacity="0.7"/>
  <ellipse cx="760" cy="152" rx="230" ry="24" fill="#0a1017" opacity="0.92"/>
  <ellipse cx="1050" cy="205" rx="200" ry="20" fill="#0a1017" opacity="0.8"/>

  <!-- morcegos -->
  <g fill="#04070a">
    <path d="M0,0 q5,-8 10,-1 q5,-7 10,1 q-5,4 -10,2 q-5,2 -10,-2 z" transform="translate(790,78)"/>
    <path d="M0,0 q5,-8 10,-1 q5,-7 10,1 q-5,4 -10,2 q-5,2 -10,-2 z" transform="translate(945,58) scale(1.2)"/>
    <path d="M0,0 q5,-8 10,-1 q5,-7 10,1 q-5,4 -10,2 q-5,2 -10,-2 z" transform="translate(858,188) scale(0.9)"/>
  </g>

  <!-- colina -->
  <path d="M0,400 L0,372 C140,346 300,362 420,378 C520,391 580,394 660,400 Z" fill="#030506"/>

  <!-- castelo -->
  <g fill="#04070a">
    <rect x="150" y="262" width="300" height="138"/>
    <g>
      <rect x="150" y="248" width="16" height="16"/>
      <rect x="180" y="248" width="16" height="16"/>
      <rect x="210" y="248" width="16" height="16"/>
      <rect x="240" y="248" width="16" height="16"/>
      <rect x="270" y="248" width="16" height="16"/>
      <rect x="300" y="248" width="16" height="16"/>
      <rect x="330" y="248" width="16" height="16"/>
      <rect x="360" y="248" width="16" height="16"/>
      <rect x="390" y="248" width="16" height="16"/>
      <rect x="420" y="248" width="16" height="16"/>
    </g>
    <!-- torre esquerda -->
    <rect x="104" y="196" width="66" height="204"/>
    <polygon points="98,200 137,124 176,200" stroke="#3fb950" stroke-opacity="0.3" stroke-width="1.5"/>
    <!-- torre pequena -->
    <rect x="180" y="226" width="42" height="80"/>
    <polygon points="176,230 201,186 226,230" stroke="#3fb950" stroke-opacity="0.3" stroke-width="1.5"/>
    <!-- torre central -->
    <rect x="236" y="150" width="128" height="250"/>
    <polygon points="228,155 300,66 372,155" stroke="#3fb950" stroke-opacity="0.35" stroke-width="1.5"/>
    <!-- torre direita -->
    <rect x="392" y="214" width="64" height="186"/>
    <polygon points="386,218 424,148 462,218" stroke="#3fb950" stroke-opacity="0.3" stroke-width="1.5"/>
    <!-- bandeira -->
    <line x1="300" y1="66" x2="300" y2="44" stroke="#04070a" stroke-width="3"/>
    <polygon points="302,46 326,52 302,58" fill="#3fb950"/>
  </g>

  <!-- janelas -->
  <g fill="#4ade80" opacity="0.85">
    <rect x="264" y="192" width="14" height="26" rx="7"/>
    <rect x="300" y="192" width="14" height="26" rx="7"/>
    <rect x="336" y="192" width="14" height="26" rx="7"/>
    <rect x="126" y="236" width="14" height="24" rx="7"/>
    <rect x="126" y="300" width="14" height="24" rx="7"/>
    <rect x="414" y="258" width="14" height="24" rx="7"/>
    <rect x="196" y="246" width="10" height="18" rx="5"/>
  </g>

  <!-- porta -->
  <path d="M284,400 L284,356 a16,16 0 0 1 32,0 L316,400 Z" fill="#050b09"/>
  <path d="M284,400 L284,356 a16,16 0 0 1 32,0 L316,400 Z" fill="none" stroke="#3fb950" stroke-opacity="0.5" stroke-width="1.5"/>

  <!-- névoa -->
  <rect x="0" y="300" width="1200" height="100" fill="url(#mist)"/>

  <!-- texto -->
  <g filter="url(#textGlow)">
    <text x="830" y="205" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="76" font-weight="700" fill="#ffffff" letter-spacing="6">José Mário</text>
    <text x="830" y="258" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="26" fill="#4ade80" letter-spacing="3">Full Stack • React • Angular • .NET</text>
  </g>
</svg>
